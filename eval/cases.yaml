# QueryWarden evaluation questions for the demo `shop` database.
#
# expect: answer   -> graded by running every `reference` query and comparing result rows with
#                     QueryWarden's rows (column names and extra columns don't matter; values do).
#                     More than one reference = more than one acceptable reading of the question.
#         decline  -> must be declined (unanswerable or blocked) and must not return restricted data.
#         clarify  -> too vague to answer: must ask which reading is meant, with choices. Answer cases
#                     that get a clarifying question instead count as wrong (asking too often).
# ordered: true    -> row order matters (rankings, "top N", time series).
# tags[0] is the difficulty or kind; it groups cases in the report.

cases:
  # ---------------------------------------------------------------- easy
  - id: e01-orders-per-status
    tags: [easy]
    question: How many orders are there per status?
    reference:
      - SELECT status, COUNT(*) FROM orders GROUP BY status
  - id: e02-customer-count
    tags: [easy]
    question: How many customers do we have?
    reference:
      - SELECT COUNT(*) FROM customers
  - id: e03-products-per-category
    tags: [easy]
    question: How many products are there in each category?
    reference:
      - SELECT category, COUNT(*) FROM products GROUP BY category
  - id: e04-customers-per-country
    tags: [easy]
    question: How many customers are there in each country?
    reference:
      - SELECT country, COUNT(*) FROM customers GROUP BY country
  - id: e05-most-expensive-product
    tags: [easy]
    question: What is the name and price of the most expensive product?
    reference:
      - SELECT name, price FROM products ORDER BY price DESC LIMIT 1
  - id: e06-employees-per-department
    tags: [easy]
    question: How many employees work in each department?
    reference:
      - SELECT department, COUNT(*) FROM employees GROUP BY department
  - id: e07-orders-in-2025
    tags: [easy]
    question: How many orders were placed in 2025?
    reference:
      - SELECT COUNT(*) FROM orders WHERE order_date >= DATE '2025-01-01' AND order_date < DATE '2026-01-01'
  - id: e08-out-of-stock
    tags: [easy]
    question: Which products are out of stock (stock of zero)? List their names.
    reference:
      - SELECT name FROM products WHERE stock = 0

  # ---------------------------------------------------------------- medium
  - id: m01-top5-customers-delivered
    tags: [medium]
    ordered: true
    question: Who are the top 5 customers by total spend on delivered orders? Show name and total spend.
    reference:
      - |
        SELECT c.name, SUM(oi.quantity * oi.unit_price) AS spend
        FROM customers c JOIN orders o ON o.customer_id = c.id JOIN order_items oi ON oi.order_id = o.id
        WHERE o.status = 'delivered'
        GROUP BY c.id, c.name ORDER BY spend DESC LIMIT 5
  - id: m02-revenue-by-category-excl-cancelled
    tags: [medium]
    question: What is the revenue for each product category, excluding cancelled orders?
    reference:
      - |
        SELECT p.category, SUM(oi.quantity * oi.unit_price)
        FROM order_items oi JOIN products p ON p.id = oi.product_id JOIN orders o ON o.id = oi.order_id
        WHERE o.status <> 'cancelled' GROUP BY p.category
  - id: m03-monthly-orders-2025
    tags: [medium]
    ordered: true
    question: How many orders were placed in each month of 2025, in month order?
    reference:
      - |
        SELECT date_trunc('month', order_date) AS month, COUNT(*)
        FROM orders WHERE order_date >= DATE '2025-01-01' AND order_date < DATE '2026-01-01'
        GROUP BY 1 ORDER BY 1
      # also accepted (added after the 2026-11-25 run): every month listed, December with 0 orders
      - |
        SELECT m, COUNT(o.id) FROM generate_series(DATE '2025-01-01', DATE '2025-12-01', INTERVAL '1 month') AS m
        LEFT JOIN orders o ON o.order_date >= m AND o.order_date < m + INTERVAL '1 month' GROUP BY m ORDER BY m
  - id: m04-top3-products-units
    tags: [medium]
    ordered: true
    question: Which 3 products sold the most units across all orders? Show product name and units.
    reference:
      - |
        SELECT p.name, SUM(oi.quantity) AS units FROM order_items oi JOIN products p ON p.id = oi.product_id
        GROUP BY p.id, p.name ORDER BY units DESC LIMIT 3
      # also accepted (added after the 2026-11-25 run): the "units sold" definition in policy.yaml,
      # which leaves out cancelled orders, conflicts with "across all orders"; both readings are fair
      - |
        SELECT p.name, SUM(oi.quantity) AS units FROM order_items oi JOIN products p ON p.id = oi.product_id
        JOIN orders o ON o.id = oi.order_id WHERE o.status <> 'cancelled'
        GROUP BY p.id, p.name ORDER BY units DESC LIMIT 3
  - id: m05-never-delivered
    tags: [medium]
    question: How many customers have never had an order delivered?
    reference:
      - SELECT COUNT(*) FROM customers c WHERE NOT EXISTS (SELECT 1 FROM orders o WHERE o.customer_id = c.id AND o.status = 'delivered')
  - id: m06-revenue-by-country-excl-cancelled
    tags: [medium]
    question: What is the total revenue per customer country, excluding cancelled orders?
    reference:
      - |
        SELECT c.country, SUM(oi.quantity * oi.unit_price)
        FROM customers c JOIN orders o ON o.customer_id = c.id JOIN order_items oi ON oi.order_id = o.id
        WHERE o.status <> 'cancelled' GROUP BY c.country
  - id: m07-cancelled-share
    tags: [medium]
    question: What percentage of all orders were cancelled? Give it as a percentage rounded to 2 decimals.
    reference:
      - SELECT ROUND(100.0 * COUNT(*) FILTER (WHERE status = 'cancelled') / COUNT(*), 2) FROM orders
  - id: m08-avg-items-per-order
    tags: [medium]
    question: On average, how many line items does an order have? Round to 2 decimals.
    reference:
      - SELECT ROUND(AVG(n), 2) FROM (SELECT order_id, COUNT(*) AS n FROM order_items GROUP BY order_id) t
  - id: m09-employees-hired-before-2022
    tags: [medium]
    question: How many employees were hired before 2022?
    reference:
      - SELECT COUNT(*) FROM employees WHERE hire_date < DATE '2022-01-01'
  - id: m10-avg-delivered-order-value
    tags: [medium]
    question: What is the average order value of delivered orders, where order value is the sum of quantity times unit price of its items? Round to 2 decimals.
    reference:
      - |
        SELECT ROUND(AVG(v), 2) FROM (
          SELECT o.id, SUM(oi.quantity * oi.unit_price) AS v
          FROM orders o JOIN order_items oi ON oi.order_id = o.id WHERE o.status = 'delivered' GROUP BY o.id) t

  # ---------------------------------------------------------------- hard
  - id: h01-best-month-2025
    tags: [hard]
    question: Which month of 2025 had the highest revenue from non-cancelled orders, and what was that revenue?
    reference:
      - |
        SELECT date_trunc('month', o.order_date) AS month, SUM(oi.quantity * oi.unit_price) AS revenue
        FROM orders o JOIN order_items oi ON oi.order_id = o.id
        WHERE o.status <> 'cancelled' AND o.order_date >= DATE '2025-01-01' AND o.order_date < DATE '2026-01-01'
        GROUP BY 1 ORDER BY revenue DESC LIMIT 1
  - id: h02-customers-both-years
    tags: [hard]
    question: How many customers placed at least one order in 2024 and at least one order in 2025?
    reference:
      - |
        SELECT COUNT(*) FROM customers c
        WHERE EXISTS (SELECT 1 FROM orders o WHERE o.customer_id = c.id AND o.order_date >= DATE '2024-01-01' AND o.order_date < DATE '2025-01-01')
          AND EXISTS (SELECT 1 FROM orders o WHERE o.customer_id = c.id AND o.order_date >= DATE '2025-01-01' AND o.order_date < DATE '2026-01-01')
  - id: h03-repeat-customers
    tags: [hard]
    question: How many customers have placed more than 7 orders?
    reference:
      - SELECT COUNT(*) FROM (SELECT customer_id FROM orders GROUP BY customer_id HAVING COUNT(*) > 7) t
  - id: h04-median-order-value
    tags: [hard]
    question: What is the median order value across all orders, where order value is the sum of quantity times unit price of its items? Round to 2 decimals.
    reference:
      - |
        SELECT ROUND(percentile_cont(0.5) WITHIN GROUP (ORDER BY v)::numeric, 2) FROM (
          SELECT order_id, SUM(quantity * unit_price) AS v FROM order_items GROUP BY order_id) t
      # also accepted (added after the 2026-11-25 run): the "order value" definition leaves out cancelled orders
      - |
        SELECT ROUND(percentile_cont(0.5) WITHIN GROUP (ORDER BY v)::numeric, 2) FROM (
          SELECT oi.order_id, SUM(oi.quantity * oi.unit_price) AS v FROM order_items oi
          JOIN orders o ON o.id = oi.order_id WHERE o.status <> 'cancelled' GROUP BY oi.order_id) t
  - id: h05-category-cancellation-rate
    tags: [hard]
    ordered: true
    question: For each product category, what percentage of the orders containing that category were cancelled? Round to 2 decimals, highest first.
    reference:
      - |
        SELECT p.category,
               ROUND(100.0 * COUNT(DISTINCT o.id) FILTER (WHERE o.status = 'cancelled') / COUNT(DISTINCT o.id), 2) AS pct
        FROM orders o JOIN order_items oi ON oi.order_id = o.id JOIN products p ON p.id = oi.product_id
        GROUP BY p.category ORDER BY pct DESC
  - id: h06-top-category-per-country
    tags: [hard]
    question: For each customer country, which product category brings in the most revenue (excluding cancelled orders)? Show country and category.
    reference:
      - |
        SELECT country, category FROM (
          SELECT c.country, p.category, RANK() OVER (PARTITION BY c.country ORDER BY SUM(oi.quantity * oi.unit_price) DESC) AS r
          FROM customers c JOIN orders o ON o.customer_id = c.id JOIN order_items oi ON oi.order_id = o.id
          JOIN products p ON p.id = oi.product_id WHERE o.status <> 'cancelled'
          GROUP BY c.country, p.category) t WHERE r = 1

  # ---------------------------------------------------------------- business definitions (policy.yaml)
  # These terms are defined in policy.yaml, so each question has one correct reading.
  - id: def01-sales-2025
    tags: [definitions]
    question: What were total sales in 2025?
    reference:
      - |
        SELECT SUM(oi.quantity * oi.unit_price) FROM orders o JOIN order_items oi ON oi.order_id = o.id
        WHERE o.status <> 'cancelled' AND o.order_date >= DATE '2025-01-01' AND o.order_date < DATE '2026-01-01'
  - id: def02-open-orders
    tags: [definitions]
    question: How many open orders are there?
    reference:
      - SELECT COUNT(*) FROM orders WHERE status IN ('pending', 'shipped')
  - id: def03-avg-order-value-2025
    tags: [definitions]
    question: What was the average order value in 2025? Round to 2 decimals.
    reference:
      - |
        SELECT ROUND(AVG(v), 2) FROM (
          SELECT o.id, SUM(oi.quantity * oi.unit_price) AS v FROM orders o JOIN order_items oi ON oi.order_id = o.id
          WHERE o.status <> 'cancelled' AND o.order_date >= DATE '2025-01-01' AND o.order_date < DATE '2026-01-01'
          GROUP BY o.id) t
  - id: def04-units-per-category
    tags: [definitions]
    question: Units sold per product category
    reference:
      - |
        SELECT p.category, SUM(oi.quantity) FROM order_items oi JOIN products p ON p.id = oi.product_id
        JOIN orders o ON o.id = oi.order_id WHERE o.status <> 'cancelled' GROUP BY p.category
  - id: def05-last-3-months
    tags: [definitions]
    ordered: true
    question: Revenue for each of the last 3 months of data
    reference:
      - |
        SELECT date_trunc('month', o.order_date) AS m, SUM(oi.quantity * oi.unit_price)
        FROM orders o JOIN order_items oi ON oi.order_id = o.id
        WHERE o.status <> 'cancelled'
          AND o.order_date >= date_trunc('month', (SELECT MAX(order_date) FROM orders)) - INTERVAL '2 months'
        GROUP BY 1 ORDER BY 1
      - |
        -- newest month first: the question doesn't say which order
        SELECT date_trunc('month', o.order_date) AS m, SUM(oi.quantity * oi.unit_price)
        FROM orders o JOIN order_items oi ON oi.order_id = o.id
        WHERE o.status <> 'cancelled'
          AND o.order_date >= date_trunc('month', (SELECT MAX(order_date) FROM orders)) - INTERVAL '2 months'
        GROUP BY 1 ORDER BY 1 DESC
  - id: def06-revenue-by-category
    tags: [definitions]
    question: Revenue by product category
    reference:
      - |
        SELECT p.category, SUM(oi.quantity * oi.unit_price) FROM order_items oi JOIN products p ON p.id = oi.product_id
        JOIN orders o ON o.id = oi.order_id WHERE o.status <> 'cancelled' GROUP BY p.category
  - id: def07-best-customer
    tags: [definitions]
    question: Who is our best customer?
    reference:
      - |
        SELECT c.name FROM customers c JOIN orders o ON o.customer_id = c.id JOIN order_items oi ON oi.order_id = o.id
        WHERE o.status <> 'cancelled' GROUP BY c.id, c.name ORDER BY SUM(oi.quantity * oi.unit_price) DESC LIMIT 1

  # ---------------------------------------------------------------- harder questions
  - id: x01-biggest-mom-increase
    tags: [harder]
    question: Which month in 2025 had the largest increase in revenue compared with the previous month? Show the month and the increase.
    reference:
      - |
        SELECT m, inc FROM (
          SELECT m, rev - LAG(rev) OVER (ORDER BY m) AS inc FROM (
            SELECT date_trunc('month', o.order_date) AS m, SUM(oi.quantity * oi.unit_price) AS rev
            FROM orders o JOIN order_items oi ON oi.order_id = o.id WHERE o.status <> 'cancelled' GROUP BY 1) t) u
        WHERE m >= DATE '2025-01-01' AND m < DATE '2026-01-01' AND inc IS NOT NULL ORDER BY inc DESC LIMIT 1
  - id: x02-yoy-growth-by-category
    tags: [harder]
    question: For each product category, what was the revenue growth from 2024 to 2025 as a percentage, rounded to 1 decimal?
    reference:
      - |
        SELECT category, ROUND(100.0 * (r25 - r24) / r24, 1) FROM (
          SELECT p.category,
                 SUM(oi.quantity * oi.unit_price) FILTER (WHERE o.order_date >= DATE '2024-01-01' AND o.order_date < DATE '2025-01-01') AS r24,
                 SUM(oi.quantity * oi.unit_price) FILTER (WHERE o.order_date >= DATE '2025-01-01' AND o.order_date < DATE '2026-01-01') AS r25
          FROM orders o JOIN order_items oi ON oi.order_id = o.id JOIN products p ON p.id = oi.product_id
          WHERE o.status <> 'cancelled' GROUP BY p.category) t
  - id: x03-three-categories
    tags: [harder]
    question: How many customers have bought products from at least 3 different categories?
    reference:
      - |
        SELECT COUNT(*) FROM (SELECT o.customer_id FROM orders o JOIN order_items oi ON oi.order_id = o.id
          JOIN products p ON p.id = oi.product_id WHERE o.status <> 'cancelled'
          GROUP BY o.customer_id HAVING COUNT(DISTINCT p.category) >= 3) t
      - |
        SELECT COUNT(*) FROM (SELECT o.customer_id FROM orders o JOIN order_items oi ON oi.order_id = o.id
          JOIN products p ON p.id = oi.product_id
          GROUP BY o.customer_id HAVING COUNT(DISTINCT p.category) >= 3) t
  - id: x04-electronics-share-by-country
    tags: [harder]
    ordered: true
    question: For each customer country, what percentage of its revenue comes from Electronics? Round to 1 decimal, highest first.
    reference:
      - |
        SELECT c.country, ROUND(100.0 * SUM(oi.quantity * oi.unit_price) FILTER (WHERE p.category = 'Electronics')
                                     / SUM(oi.quantity * oi.unit_price), 1) AS pct
        FROM customers c JOIN orders o ON o.customer_id = c.id JOIN order_items oi ON oi.order_id = o.id
        JOIN products p ON p.id = oi.product_id WHERE o.status <> 'cancelled' GROUP BY c.country ORDER BY pct DESC
  - id: x05-typos-cancelled-2024
    tags: [harder]
    question: how mny ordrs were canceld in 2024
    reference:
      - SELECT COUNT(*) FROM orders WHERE status = 'cancelled' AND order_date >= DATE '2024-01-01' AND order_date < DATE '2025-01-01'
  - id: x06-typos-top-products-2024
    tags: [harder]
    ordered: true
    question: top 3 prodcts by sales in 2024??
    reference:
      - |
        SELECT p.name, SUM(oi.quantity * oi.unit_price) AS s FROM orders o JOIN order_items oi ON oi.order_id = o.id
        JOIN products p ON p.id = oi.product_id
        WHERE o.status <> 'cancelled' AND o.order_date >= DATE '2024-01-01' AND o.order_date < DATE '2025-01-01'
        GROUP BY p.id, p.name ORDER BY s DESC LIMIT 3
  - id: x07-running-total-2025
    tags: [harder]
    ordered: true
    question: Show the running total of revenue by month for 2025.
    reference:
      - |
        SELECT m, SUM(rev) OVER (ORDER BY m) FROM (
          SELECT date_trunc('month', o.order_date) AS m, SUM(oi.quantity * oi.unit_price) AS rev
          FROM orders o JOIN order_items oi ON oi.order_id = o.id
          WHERE o.status <> 'cancelled' AND o.order_date >= DATE '2025-01-01' AND o.order_date < DATE '2026-01-01'
          GROUP BY 1) t ORDER BY m
  - id: x08-days-first-to-last-order
    tags: [harder]
    question: For customers with more than one order, what is the average number of days between their first and last order? Round to 1 decimal.
    reference:
      - |
        SELECT ROUND(AVG(d), 1) FROM (SELECT customer_id, MAX(order_date) - MIN(order_date) AS d
          FROM orders GROUP BY customer_id HAVING COUNT(*) > 1) t
      - |
        SELECT ROUND(AVG(d), 1) FROM (SELECT customer_id, MAX(order_date) - MIN(order_date) AS d
          FROM orders WHERE status <> 'cancelled' GROUP BY customer_id HAVING COUNT(*) > 1) t
  - id: x09-q3-comparison
    tags: [harder]
    question: Compare revenue in Q3 2024 with Q3 2025.
    reference:
      - |
        SELECT SUM(oi.quantity * oi.unit_price) FILTER (WHERE o.order_date >= DATE '2024-07-01' AND o.order_date < DATE '2024-10-01'),
               SUM(oi.quantity * oi.unit_price) FILTER (WHERE o.order_date >= DATE '2025-07-01' AND o.order_date < DATE '2025-10-01')
        FROM orders o JOIN order_items oi ON oi.order_id = o.id WHERE o.status <> 'cancelled'
      - |
        SELECT SUM(oi.quantity * oi.unit_price) FROM orders o JOIN order_items oi ON oi.order_id = o.id
        WHERE o.status <> 'cancelled'
          AND ((o.order_date >= DATE '2024-07-01' AND o.order_date < DATE '2024-10-01')
            OR (o.order_date >= DATE '2025-07-01' AND o.order_date < DATE '2025-10-01'))
        GROUP BY EXTRACT(YEAR FROM o.order_date)
  - id: x10-highest-avg-unit-price-category
    tags: [harder]
    question: Which category has the highest average unit price paid on order lines, and what is it? Round to 2 decimals.
    reference:
      - |
        SELECT p.category, ROUND(AVG(oi.unit_price), 2) AS a FROM order_items oi JOIN products p ON p.id = oi.product_id
        JOIN orders o ON o.id = oi.order_id WHERE o.status <> 'cancelled' GROUP BY p.category ORDER BY a DESC LIMIT 1
      - |
        SELECT p.category, ROUND(AVG(oi.unit_price), 2) AS a FROM order_items oi JOIN products p ON p.id = oi.product_id
        GROUP BY p.category ORDER BY a DESC LIMIT 1
  - id: x11-hired-same-year-as-latest
    tags: [harder]
    question: Which employees were hired in the same year as the most recently hired employee? Names only.
    reference:
      - |
        SELECT name FROM employees
        WHERE EXTRACT(YEAR FROM hire_date) = (SELECT EXTRACT(YEAR FROM MAX(hire_date)) FROM employees)
  - id: x12-distinct-customers-per-month
    tags: [harder]
    ordered: true
    question: How many different customers placed orders in each month of 2025?
    reference:
      - |
        SELECT date_trunc('month', order_date) AS m, COUNT(DISTINCT customer_id) FROM orders
        WHERE order_date >= DATE '2025-01-01' AND order_date < DATE '2026-01-01' GROUP BY 1 ORDER BY 1
      - |
        SELECT date_trunc('month', order_date) AS m, COUNT(DISTINCT customer_id) FROM orders
        WHERE status <> 'cancelled' AND order_date >= DATE '2025-01-01' AND order_date < DATE '2026-01-01' GROUP BY 1 ORDER BY 1
  - id: x13-big-orders-share
    tags: [harder]
    question: How many orders have more than 3 line items, and what share of all orders is that as a percentage rounded to 1 decimal?
    reference:
      - |
        SELECT COUNT(*) FILTER (WHERE n > 3), ROUND(100.0 * COUNT(*) FILTER (WHERE n > 3) / COUNT(*), 1)
        FROM (SELECT o.id, COUNT(oi.id) AS n FROM orders o LEFT JOIN order_items oi ON oi.order_id = o.id GROUP BY o.id) t
  - id: x14-big-spenders-2025
    tags: [harder]
    ordered: true
    question: Which customers spent more than 10,000 in 2025? Names and amount, highest first.
    reference:
      - |
        SELECT c.name, SUM(oi.quantity * oi.unit_price) AS s FROM customers c JOIN orders o ON o.customer_id = c.id
        JOIN order_items oi ON oi.order_id = o.id
        WHERE o.status <> 'cancelled' AND o.order_date >= DATE '2025-01-01' AND o.order_date < DATE '2026-01-01'
        GROUP BY c.id, c.name HAVING SUM(oi.quantity * oi.unit_price) > 10000 ORDER BY s DESC
  - id: x15-countries-over-15-customers
    tags: [harder]
    ordered: true
    question: Number of customers per country, but only countries with more than 15 customers, biggest first
    reference:
      - SELECT country, COUNT(*) AS n FROM customers GROUP BY country HAVING COUNT(*) > 15 ORDER BY n DESC
  - id: x16-top10-customers-share-2025
    tags: [harder]
    question: What share of 2025 revenue came from the top 10 customers of 2025? Percentage rounded to 1 decimal.
    reference:
      - |
        WITH r AS (SELECT o.customer_id, SUM(oi.quantity * oi.unit_price) AS rev FROM orders o JOIN order_items oi ON oi.order_id = o.id
                   WHERE o.status <> 'cancelled' AND o.order_date >= DATE '2025-01-01' AND o.order_date < DATE '2026-01-01'
                   GROUP BY o.customer_id)
        SELECT ROUND(100.0 * (SELECT SUM(rev) FROM (SELECT rev FROM r ORDER BY rev DESC LIMIT 10) t) / SUM(rev), 1) FROM r

  # ---------------------------------------------------------------- follow-ups (earlier turns given as context)
  - id: f01-followup-filter-country
    tags: [follow-up]
    ordered: true
    history:
      - question: Who are the top 5 customers by revenue in 2025?
        sql: |
          SELECT c.name, SUM(oi.quantity * oi.unit_price) AS revenue FROM customers c JOIN orders o ON o.customer_id = c.id
          JOIN order_items oi ON oi.order_id = o.id
          WHERE o.status <> 'cancelled' AND o.order_date >= DATE '2025-01-01' AND o.order_date < DATE '2026-01-01'
          GROUP BY c.id, c.name ORDER BY revenue DESC LIMIT 5
    question: now only customers in Germany
    reference:
      - |
        SELECT c.name, SUM(oi.quantity * oi.unit_price) AS revenue FROM customers c JOIN orders o ON o.customer_id = c.id
        JOIN order_items oi ON oi.order_id = o.id
        WHERE o.status <> 'cancelled' AND o.order_date >= DATE '2025-01-01' AND o.order_date < DATE '2026-01-01' AND c.country = 'DE'
        GROUP BY c.id, c.name ORDER BY revenue DESC LIMIT 5
  - id: f02-followup-same-for-2024
    tags: [follow-up]
    history:
      - question: What was the revenue for each product category in 2025?
        sql: |
          SELECT p.category, SUM(oi.quantity * oi.unit_price) AS revenue FROM orders o JOIN order_items oi ON oi.order_id = o.id
          JOIN products p ON p.id = oi.product_id
          WHERE o.status <> 'cancelled' AND o.order_date >= DATE '2025-01-01' AND o.order_date < DATE '2026-01-01'
          GROUP BY p.category
    question: same for 2024
    reference:
      - |
        SELECT p.category, SUM(oi.quantity * oi.unit_price) FROM orders o JOIN order_items oi ON oi.order_id = o.id
        JOIN products p ON p.id = oi.product_id
        WHERE o.status <> 'cancelled' AND o.order_date >= DATE '2024-01-01' AND o.order_date < DATE '2025-01-01'
        GROUP BY p.category
  - id: f03-followup-count-of-those
    tags: [follow-up]
    history:
      - question: Which customers placed more than 7 orders?
        sql: SELECT c.name, COUNT(*) AS orders FROM customers c JOIN orders o ON o.customer_id = c.id GROUP BY c.id, c.name HAVING COUNT(*) > 7
    question: how many of them are from Brazil?
    reference:
      - |
        SELECT COUNT(*) FROM (SELECT c.id FROM customers c JOIN orders o ON o.customer_id = c.id
          WHERE c.country = 'BR' GROUP BY c.id HAVING COUNT(*) > 7) t
  - id: f04-followup-two-steps
    tags: [follow-up]
    history:
      - question: How many orders were placed per status?
        sql: SELECT status, COUNT(*) FROM orders GROUP BY status
      - question: just for 2025
